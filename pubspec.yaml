name: unisson
description: Serverless unified music player - local + Qobuz + YouTube Music.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  flutter_cache_manager: ^3.4.2
  rxdart: ^0.28.0
  sqflite: ^2.4.2
  webview_flutter: ^4.13.0
  http: ^1.2.0
  crypto: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
