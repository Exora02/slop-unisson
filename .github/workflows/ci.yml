name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true # caches Flutter SDK + pub packages keyed on pubspec.lock

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

  build-android:
    name: Android APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship the Android SDK + NDK 28.2.13676358 (the pinned
      # version), so no SDK install step is needed. Gradle caches are the
      # minute-saver: deps + wrapper, keyed on the gradle files.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          mkdir -p release
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            mv "$f" "release/unisson-android-${abi}-release.apk"
          done
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: unisson-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/release/*.apk
          retention-days: 30

      # On version tags, attach APKs to a GitHub release — permanent
      # download links straight from the repo page.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/release/*.apk
          generate_release_notes: true
